<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090B0F" />
  <title>Laboratorio — Argyra</title>
  <meta name="description" content="Gestión de los proyectos del Laboratorio." />
  <link rel="icon" type="image/svg+xml" href="assets/img/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="navbar__brand"><span class="wordmark sheen">ARGYRA</span></a>
    <nav class="navbar__links">
      <a href="afiliados.html">Afiliados</a>
      <a href="laboratorio.html">Laboratorio</a>
      <a href="solicitar.html">Solicitar apoyo</a>
    </nav>
    <a class="navbar__session" data-session-slot href="ingresar.html">Ingresar</a>
  </header>

  <main>
    <section class="container section">
      <h1>El Laboratorio</h1>
      <div class="filters mt-md">
        <a class="chip" href="admin.html">Estadísticas</a>
        <a class="chip" href="admin-usuarios.html">Usuarios</a>
        <a class="chip" href="admin-afiliados.html">Afiliados</a>
        <a class="chip" href="admin-metas.html">Metas</a>
        <a class="chip active" href="admin-laboratorio.html">Laboratorio</a>
      </div>

      <div class="card mt-lg">
        <p class="eyebrow">Nuevo proyecto</p>
        <form id="form" class="mt-md" novalidate>
          <label class="field">
            <span class="field__label">Nombre</span>
            <input class="input" name="name" />
          </label>
          <label class="field">
            <span class="field__label">Descripción</span>
            <textarea class="textarea" name="description" rows="3"></textarea>
          </label>
          <div class="field">
            <span class="field__label">Tipo</span>
            <div class="chips" id="tipo">
              <button type="button" class="chip active" data-kind="bot">Bot</button>
              <button type="button" class="chip" data-kind="app">App</button>
              <button type="button" class="chip" data-kind="web">Web</button>
              <button type="button" class="chip" data-kind="otro">Otro</button>
            </div>
          </div>
          <div class="field">
            <span class="field__label">Estado</span>
            <div class="chips" id="estado">
              <button type="button" class="chip active" data-status="in_progress">En curso</button>
              <button type="button" class="chip" data-status="completed">Terminado</button>
            </div>
          </div>
          <button class="btn btn--primary btn--block" type="submit">Crear proyecto</button>
        </form>
      </div>

      <div id="lista" class="mt-md"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>Argyra — comunidad de comunidades.</p>
      <div class="footer__links">
        <a href="afiliados.html">Afiliados</a>
        <a href="laboratorio.html">Laboratorio</a>
        <a href="solicitar.html">Solicitar apoyo</a>
        <a href="ingresar.html">Ingresar</a>
      </div>
    </div>
  </footer>
  <nav class="tabbar">
    <a href="index.html"><span class="tabbar__dot"></span>Argyra</a>
    <a href="afiliados.html"><span class="tabbar__dot"></span>Afiliados</a>
    <a href="laboratorio.html"><span class="tabbar__dot"></span>Lab</a>
    <a href="panel.html"><span class="tabbar__dot"></span>Panel</a>
  </nav>

  <script type="module" src="js/page-admin-laboratorio.js"></script>
</body>
</html>
