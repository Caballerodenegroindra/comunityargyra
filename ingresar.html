<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090B0F" />
  <title>Ingresar — Argyra</title>
  <meta name="description" content="Accede a tu panel de Argyra." />
  <link rel="icon" type="image/svg+xml" href="assets/img/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="navbar__brand"><span class="wordmark sheen">ARGYRA</span></a>
    <nav class="navbar__links">
      <a href="afiliados.html">Afiliados</a>
      <a href="laboratorio.html">Laboratorio</a>
      <a href="solicitar.html">Solicitar apoyo</a>
    </nav>
    <a class="navbar__session" data-session-slot href="ingresar.html">Ingresar</a>
  </header>

  <main>
    <section class="container section" style="max-width:420px">
      <h1>Ingresar</h1>
      <p class="lead small mt-sm">Accede al estado de tu solicitud y a tus avances.</p>

      <form id="form" class="mt-lg" novalidate>
        <label class="field">
          <span class="field__label">Correo electrónico</span>
          <input class="input" name="email" type="email" autocomplete="email" />
          <span class="field__error" data-error="email"></span>
        </label>

        <label class="field">
          <span class="field__label">Contraseña</span>
          <input class="input" name="password" type="password" autocomplete="current-password" />
          <span class="field__error" data-error="password"></span>
        </label>

        <div id="aviso"></div>

        <button class="btn btn--primary btn--block mt-md" type="submit" id="entrar">Entrar</button>

        <div class="btn-row mt-md" style="justify-content:space-between">
          <button type="button" class="btn btn--ghost btn--sm" id="recuperar">Recuperar contraseña</button>
          <a class="btn btn--ghost btn--sm" href="solicitar.html">Crear solicitud</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>Argyra — comunidad de comunidades.</p>
      <div class="footer__links">
        <a href="afiliados.html">Afiliados</a>
        <a href="laboratorio.html">Laboratorio</a>
        <a href="solicitar.html">Solicitar apoyo</a>
        <a href="ingresar.html">Ingresar</a>
      </div>
    </div>
  </footer>
  <nav class="tabbar">
    <a href="index.html"><span class="tabbar__dot"></span>Argyra</a>
    <a href="afiliados.html"><span class="tabbar__dot"></span>Afiliados</a>
    <a href="laboratorio.html"><span class="tabbar__dot"></span>Lab</a>
    <a href="panel.html"><span class="tabbar__dot"></span>Panel</a>
  </nav>

  <script type="module" src="js/page-ingresar.js"></script>
</body>
</html>
