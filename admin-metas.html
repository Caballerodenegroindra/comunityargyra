<head>

<body>
  <header class="navbar">
    <a href="index.html" class="navbar__brand"><span class="wordmark sheen">ARGYRA</span></a>

  <main>

      <div class="filters mt-md">
        <a class="chip" href="admin.html">Estadísticas</a>
        <a class="chip" href="admin-usuarios.html">Usuarios</a>
        <a class="chip" href="admin-afiliados.html">Afiliados</a>

      <div class="card mt-lg">
        <label class="field">
          <span class="field__label">Afiliado</span>
          <select class="select" id="afiliado"><option value="">Elige un afiliado</option></select>
        </label>
        <form id="form" novalidate>
          <label class="field">
            <span class="field__label">Nueva meta</span>
            <input class="input" name="title" />
          </label>
          <label class="field">
            <span class="field__label">Descripción</span>
            <input class="input" name="description" />
          </label>
          <button class="btn btn--primary btn--block" type="submit">Crear meta</button>
        </form>
      </div>

      <div id="lista" class="mt-md"></div>
    </section>
  </main>

  <footer class="footer">

      <div class="footer__links">
